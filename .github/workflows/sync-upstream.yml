name: Sync with upstream

on:
  schedule:
    - cron: "0 8 1 * *"
  workflow_dispatch:

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream remote
        run: git remote add upstream https://github.com/9seconds/mtg.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Check for new commits
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh pr list --state open --label sync --json number --jq 'length')" != 0 ]; then
            echo 'An upstream sync PR is already open; review it before starting another.'
            echo 'count=0' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          COUNT=$(git rev-list --count HEAD..upstream/master)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Upstream is $COUNT commits ahead"

      - name: Merge upstream
        if: steps.check.outputs.count != '0'
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git merge upstream/master --no-edit
        continue-on-error: true

      - name: Push a review branch if merge succeeded
        id: branch
        if: steps.check.outputs.count != '0' && steps.merge.outcome == 'success'
        run: |
          BRANCH="sync/upstream-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$BRANCH"
          git push origin "$BRANCH"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Report conflict (one open issue, commented on repeats)
        if: steps.merge.outcome == 'failure'
        uses: actions/github-script@v7
        env:
          AHEAD: ${{ steps.check.outputs.count }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'sync', per_page: 1,
            });
            if (open.data.length > 0) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: open.data[0].number,
                body: `Still conflicting: upstream is ${process.env.AHEAD} commits ahead (${new Date().toISOString().slice(0, 10)}).`,
              });
              return;
            }
            await github.rest.issues.create({
              owner, repo,
              title: 'Upstream sync failed — merge conflict',
              body: 'Automatic merge from `9seconds/mtg:master` failed due to conflicts.\n\nResolve manually on a branch and open a PR:\n```\ngit fetch upstream\ngit switch -c sync/upstream-$(date +%F) master\ngit merge upstream/master\n# fix conflicts, go build ./... && go test ./...\ngit push -u origin HEAD\n```\nThis issue is closed automatically by the next successful sync; repeat failures are added as comments here.',
              labels: ['sync'],
            });

      - name: Open a sync PR for review and CI
        if: steps.check.outputs.count != '0' && steps.merge.outcome == 'success'
        uses: actions/github-script@v7
        env:
          SYNC_BRANCH: ${{ steps.branch.outputs.name }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'sync', per_page: 100,
            });
            const closes = open.data.filter(issue => !issue.pull_request)
              .map(issue => `Closes #${issue.number}`).join('\n');
            const pr = await github.rest.pulls.create({
              owner, repo,
              head: process.env.SYNC_BRANCH,
              base: context.payload.repository.default_branch,
              title: 'sync: merge upstream/master',
              body: 'Review this merge and approve the PR workflows before merging. '
                + 'A clean textual merge does not prove the code builds or tests pass. '
                + 'Use a merge commit to preserve upstream ancestry.\n\n' + closes,
            });
            await github.rest.issues.addLabels({
              owner, repo, issue_number: pr.data.number, labels: ['sync'],
            });
            core.notice(`Sync PR: ${pr.data.html_url}`);
